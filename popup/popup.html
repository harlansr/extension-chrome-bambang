<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bambang</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./popup.js"></script>
</head>
<body>
    <header class="section-head">
        <h1 class="title">Keuangan</h1>
        <button id="refresh-price" class="icon-btn" title="Muat ulang harga">&#x21bb;</button>
    </header>
    <section id="container-economy" class="card">
        <table class="price-table">
            <thead>
                <tr><th></th><th>Harga</th><th>Aset saya</th></tr>
            </thead>
            <tbody>
                <tr>
                    <td class="label">USD</td>
                    <td id="current_usd">-</td>
                    <td id="current_usd_own" class="text-blur" title="Klik untuk tampilkan">-</td>
                </tr>
                <tr>
                    <td class="label">Emas</td>
                    <td id="current_gold">-</td>
                    <td id="current_gold_own" class="text-blur" title="Klik untuk tampilkan">-</td>
                </tr>
            </tbody>
        </table>
        <div id="price-updated" class="muted"></div>
        <div id="backend-note" class="error" hidden>Backend tidak aktif (jalankan server Go di 127.0.0.1:8080)</div>
    </section>

    <section id="container-youtube" hidden>
        <h1 class="title">YouTube</h1>
        <div id="yt-bookmarks"></div>
    </section>

    <section class="container-bookmark">
        <header class="section-head">
            <h1 class="title">Bookmark</h1>
            <button id="toggle-add" class="icon-btn" title="Tambah bookmark">+</button>
        </header>

        <form id="add-form" class="card" hidden autocomplete="off">
            <input id="add-title" type="text" placeholder="Judul" maxlength="60" required>
            <input id="add-url" type="url" placeholder="https://..." required>
            <input id="add-group" type="text" placeholder="Grup (opsional)" maxlength="30" list="group-list">
            <datalist id="group-list"></datalist>
            <div id="add-error" class="error" hidden></div>
            <div class="form-actions">
                <button type="button" id="add-current" class="btn">Tab ini</button>
                <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
        </form>

        <input id="search" type="search" placeholder="Cari bookmark..." hidden>
        <div id="web-bookmark"></div>
    </section>

    <footer class="container-footer">
        <button id="open-settings" class="icon-btn" title="Pengaturan">&#x2699;</button>
    </footer>
</body>
</html>
